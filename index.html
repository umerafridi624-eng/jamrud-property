<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamrud Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f8;
            text-align: center;
        }
        header {
            background: #14532d;
            color: white;
            padding: 30px 15px;
        }
        .container {
            padding: 25px;
        }
        .card {
            background: white;
            margin: 15px auto;
            padding: 25px;
            max-width: 500px;
            border-radius: 12px;
        }
        h2 {
            color: #14532d;
        }
    </style>
</head>
<body>

<header>
    <h1>Jamrud Property</h1>
    <p>جمرود میں زمین اور پراپرٹی کی معلومات</p>
</header>

<div class="container">
    <div class="card">
        <h2>زمین کی پیمائش</h2>
        <p>زمین کی پیمائش کی سہولت جلد دستیاب ہوگی۔</p>
    </div>

    <div class="card">
        <h2>زمین اور پلاٹ</h2>
        <p>جمرود میں خرید و فروخت کے لیے پراپرٹی۔</p>
    </div>

    <div class="card">
        <h2>ہمارا نقشہ</h2>
        <p>جمرود کا نقشہ جلد یہاں شامل ہوگا۔</p>
    </div>
</div>

</body>
</html>
