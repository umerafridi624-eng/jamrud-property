<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamrud Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5f8;
            text-align: center;
        }
        header {
            background: #14532d;
            color: white;
            padding: 30px 15px;
        }
        .container {
            padding: 25px;
        }
        .card {
            background: white;
            margin: 15px auto;
            padding: 25px;
            max-width: 500px;
            border-radius: 12px;
        }
        h2 {
            color: #14532d;
        }
    </style>
</head>
<body>

<header>
    <h1>Jamrud Property</h1>
    <p>جمرود میں زمین اور پراپرٹی کی معلومات</p>
</header>

<div class="container">
    <div class="card">
        <h2>زمین کی پیمائش</h2>
        <p>زمین کی پیمائش کی سہولت جلد دستیاب ہوگی۔</p>
    </div>

    <div class="card">
        <h2>زمین اور پلاٹ</h2>
        <p>جمرود میں خرید و فروخت کے لیے پراپرٹی۔</p>
    </div>

    <div class="card">
        <h2>ہمارا نقشہ</h2>
        <p>جمرود کا نقشہ جلد یہاں شامل ہوگا۔</p>
    </div>
</div>
<h2>جمرود کا نقشہ</h2>
<div style="width:100%; height:400px; border-radius:12px; overflow:hidden;">
  <iframe
    src="https://www.openstreetmap.org/export/embed.html?bbox=71.30%2C33.95%2C71.50%2C34.10&layer=mapnik"
    width="100%"
    height="100%"
    style="border:0;"
    loading="lazy">
  </iframe>
</div>
<h2>زمین کی پیمائش کا کیلکولیٹر</h2>

<div style="background:#f0f7ff;padding:20px;border-radius:12px;margin:15px 0;">
  <label>رقبہ درج کریں:</label>
  <input type="number" id="landValue" placeholder="مثلاً 1000" style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box;">

  <label>پیمائش منتخب کریں:</label>
  <select id="landUnit" style="width:100%;padding:12px;margin:10px 0;">
    <option value="sqft">مربع فٹ</option>
    <option value="sqm">مربع میٹر</option>
    <option value="marla">مرلہ</option>
    <option value="kanal">کنال</option>
  </select>

  <button onclick="calculateLand()" style="background:#087b43;color:white;padding:12px 25px;border:0;border-radius:8px;cursor:pointer;">حساب کریں</button>

  <div id="landResult" style="margin-top:20px;line-height:2;font-weight:bold;"></div>
</div>

<script>
function calculateLand() {
  const value = Number(document.getElementById('landValue').value);
  const unit = document.getElementById('landUnit').value;
  const result = document.getElementById('landResult');

  if (!Number.isFinite(value) || value <= 0) {
    result.innerHTML = "براہ کرم درست رقبہ درج کریں۔";
    return;
  }

  let sqft = value;
  if (unit === 'sqm') sqft = value * 10.7639;
  if (unit === 'marla') sqft = value * 272.25;
  if (unit === 'kanal') sqft = value * 5445;

  const marla = sqft / 272.25;
  const kanal = marla / 20;
  const sqm = sqft / 10.7639;

  result.innerHTML =
    "مربع فٹ: " + sqft.toFixed(2) +
    "<br>مربع میٹر: " + sqm.toFixed(2) +
    "<br>مرلہ: " + marla.toFixed(2) +
    "<br>کنال: " + kanal.toFixed(3);
}
</script>
<h2>اپنی پراپرٹی فروخت کے لیے درج کریں</h2>

<form action="https://formsubmit.co/umerafridi624@gmail.com" method="POST">
  <label>پراپرٹی کی قسم:</label><br>
  <select name="property_type">
    <option>پلاٹ</option>
    <option>زرعی زمین</option>
    <option>مکان</option>
    <option>دکان</option>
  <select>
  <br><br>

  <label>زمین کا رقبہ:</label><br>
  <input type="text" name="area" placeholder="مثلاً 20 مرلہ">
  <br><br>

  <label>قیمت:</label><br>
  <input type="text" name="price" placeholder="مثلاً 50 لاکھ روپے">
  <br><br>

  <label>مقام:</label><br>
 <input type="text" name="location" placeholder="مثلاً جمروڈ بازار">
  <br><br>

  <label>رابطہ نمبر:</label><br>
  <input type="tel" name="phone" placeholder="03XXXXXXXXX">
  <br><br>

  <label>مزید تفصیلات:</label><br>

  <br><br>

  <button type="submit">پراپرٹی درج کریں</button>
<form action="https://formsubmit.co/umerafridi624@gmail.com" method="POST">
</body>
    
</html>
